name: Merge PR

on:
  issue_comment:
    types: [created]

# One merge attempt per PR at a time, never cancelled. A second `/lgtm` comment
# should queue behind the first rather than race it or abort a merge midway.
concurrency:
  group: merge-${{ github.event.issue.number }}
  cancel-in-progress: false

# Deny by default: the one job declares exactly the scope it needs. A future
# job added without its own block inherits nothing rather than the repo default.
permissions: {}

jobs:
  merge:
    name: Merge PR
    runs-on: ubuntu-latest
    # Only run on PR comments from repo owner with slash commands
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/lgtm') ||
        startsWith(github.event.comment.body, '/approve') ||
        startsWith(github.event.comment.body, '/shipit')
      )
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          echo "head_sha=$(echo $PR_DATA | jq -r '.head.sha')" >> $GITHUB_OUTPUT

      - name: Check the CI gate
        id: ci-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # The `CI Gate` job in ci.yml succeeds only when every job that can
          # block a merge succeeded, and its name never changes, unlike the
          # per-extension matrix jobs. Read its latest run for this exact
          # commit. A run that is queued or in progress is not a pass, and
          # neither is no run at all.
          #
          # check_name filters server-side, so the answer does not depend on
          # how many matrix jobs the commit has. Only runs the GitHub Actions
          # app created count: any app with checks:write could post a check
          # run with the same name.
          state=$(gh api -X GET "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            -f check_name="CI Gate" -f filter=latest \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")]
                  | if length == 0 then "missing"
                    else (sort_by(.started_at) | last
                          | if .status == "completed" then .conclusion else .status end)
                    end')
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment if CI not passed
        if: steps.ci-status.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.ci-status.outputs.state }}
        run: |
          if [ "$STATE" = "missing" ]; then
            reason="This commit has no \`CI Gate\` check. A pull request whose last push predates the CI Gate job has none: push to the branch (or update it from main) so CI runs again, then comment again."
          else
            reason="The \`CI Gate\` check for this commit is \`${STATE}\`. It must be \`success\`. If it is queued or in progress, wait for it and comment again."
          fi
          gh pr comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "Cannot merge: ${reason}"
          exit 1

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch

      - name: Trigger CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --repo ${{ github.repository }} --ref main
