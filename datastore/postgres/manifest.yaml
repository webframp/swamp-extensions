manifestVersion: 1
name: "@webframp/postgres-datastore"
license: Apache-2.0
version: "2026.10.21.1"
description: >
  Stores swamp runtime data in PostgreSQL with row-based distributed locking.
  Compatible with AWS RDS, Aurora, and Aurora Serverless v2. Uses fencing tokens
  for split-brain safety across failover events. Emits OpenTelemetry spans for
  SQL operations, lock acquisition/release, and push/pull sync so datastore
  activity is visible in traces when a TracerProvider is configured. The
  connection string, which embeds the password, is read from a swamp vault
  with a `vault.get` expression in the datastore config.
repository: https://github.com/webframp/swamp-extensions
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels: [aurora, aws, datastore, observability, opentelemetry, postgres, rds]
datastores:
  - postgres_datastore/mod.ts
additionalFiles:
  - README.md
  - LICENSE.md
