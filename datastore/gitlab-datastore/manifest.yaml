manifestVersion: 1
name: "@webframp/gitlab-datastore"
version: "2026.08.25.1"
description: >
  Stores swamp runtime data in GitLab using the Terraform state HTTP API.
  Provides distributed locking via GitLab's native state locking mechanism
  and bidirectional sync between local cache and GitLab. Emits OpenTelemetry
  spans for GitLab API calls, lock acquisition/release, and push/pull sync so
  datastore activity is visible in traces when a TracerProvider is configured.
license: Apache-2.0
repository: https://github.com/webframp/swamp-extensions
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels: [datastore, gitlab, observability, opentelemetry, terraform-state]
datastores:
  - gitlab_datastore/mod.ts
additionalFiles:
  - README.md
  - LICENSE.md
