manifestVersion: 1
name: "@webframp/hashicorp-vault"
version: "2026.08.21.1"
description: "HashiCorp Vault secrets management via REST API (KV v1 and v2). Emits OpenTelemetry spans for get, put, and list, with one child span per request in the recursive list walk, so vault reads are visible in traces including reads during model and workflow runs where the host emits nothing. Span attributes carry the vault name, key name, and KV version only — never secret values, tokens, or error messages."
repository: "https://github.com/webframp/swamp-extensions"
vaults:
  - hashicorp.ts
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - vault
  - secrets
  - hashicorp
  - security
  - enterprise
  - kv
  - opentelemetry
  - observability
