manifestVersion: 1
name: "@webframp/aws/adopt"
version: "2026.09.26.1"
description: |
  Brownfield adoption of AWS resources into swamp models, whatever created
  them. plan_account_sweep enumerates about 40 resource types in a region
  through Cloud Control and writes adoption candidates with deterministic
  flags, live dependencies, swamp-managed matching, and coverage gaps.
  plan_stack_adoption scopes the same question to one CloudFormation stack.

  ## Authentication

  Uses the default AWS credential chain, or the optional `profile` global
  argument. Required read permissions: Cloud Control (ListResources,
  GetResource) plus the service reads it makes on your behalf, which the AWS
  managed ReadOnlyAccess policy covers; STS GetCallerIdentity for the sweep;
  CloudFormation (ListStackResources) for stack adoption; and EC2, RDS, and
  Secrets Manager for the discover_* methods.

  ## Quick Start

  ```bash
  swamp extension pull @webframp/aws/adopt
  swamp model create @webframp/aws/adopt acct --global-arg region=us-east-1
  swamp model method run acct plan_account_sweep
  swamp data get acct sweep-us-east-1 --json
  ```
repository: "https://github.com/webframp/swamp-extensions"
models:
  - aws/adopt.ts
workflows:
  - adopt-stack.yaml
  - adopt-cfn-stack.yaml
  - adopt-drift-check.yaml
reports:
  - adopt_report.ts
  - adopt_drift_report.ts
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - aws
  - adoption
  - brownfield
  - import
  - infrastructure
  - iac
dependencies:
  - "@swamp/aws/ec2@2026.09.24.1"
  - "@swamp/aws/rds@2026.09.25.1"
  - "@swamp/aws/secretsmanager@2026.09.25.1"
