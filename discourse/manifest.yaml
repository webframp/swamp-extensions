manifestVersion: 1
name: "@webframp/discourse"
license: Apache-2.0
version: "2026.10.21.1"
description: |
  Query Discourse forums via the public REST API. List categories, browse
  topics, read full posts, and search. Supports optional API key for
  authenticated access.

  ## Authentication

  Public forums need no authentication. For private instances, store an API
  key in a swamp vault and wire the `apiKey` global argument with a
  `vault.get` expression; never pass the literal key.

  ## Usage

  ```bash
  # Public forum
  swamp model create @webframp/discourse security-forum \
    --global-arg host=discourse.example.com

  # Private forum
  swamp vault create local_encryption discourse   # once, if you have no vault yet
  swamp vault put discourse API_KEY   # prompts for the key
  swamp model create @webframp/discourse private-forum \
    --global-arg host=forum.example.com \
    --global-arg 'apiKey=${{ vault.get("discourse", "API_KEY") }}' \
    --global-arg apiUsername=my-user

  swamp model method run security-forum list_categories
  swamp model method run security-forum list_latest
  swamp model method run security-forum list_category_topics --input slug=cyber-news --input categoryId=8
  swamp model method run security-forum get_topic --input topicId=170
  swamp model method run security-forum search --input query=CVE
  ```
repository: "https://github.com/webframp/swamp-extensions"
models:
  - discourse/discourse.ts
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - api
  - community
  - discourse
  - forum
  - news
  - security
