manifestVersion: 1
name: "@webframp/gcp/vertex-usage"
license: Apache-2.0
version: "2026.10.21.1"
description: |
  GCP Vertex AI and Gemini API usage and cost analysis. Reads token and request
  volume from Cloud Monitoring and dollar cost from the Cloud Billing export in
  BigQuery, over the same complete UTC days (standard and FOCUS exports are
  both supported). Projects are listed explicitly or discovered
  at runtime through Cloud Resource Manager. Results are one resource instance
  per project, filterable with CEL.

  ## Authentication

  Store a service account key or an `authorized_user` ADC file in a swamp vault
  and wire the `serviceAccountJson` global argument with a `vault.get`
  expression. No `gcloud` CLI dependency. The `GCP_ACCESS_TOKEN` and
  `GOOGLE_APPLICATION_CREDENTIALS` environment variables are read as
  fallbacks, but they are not redacted and are not recommended.

  ## Required Permissions

  - `monitoring.timeSeries.list` on each project (Monitoring Viewer)
  - `resourcemanager.projects.get` for project discovery
  - BigQuery Data Viewer on the export dataset and BigQuery Job User for the
    billing methods

  ## Usage

  ```bash
  swamp vault create local_encryption gcp   # once, if you have no vault yet
  swamp vault put gcp SA_KEY < key.json && rm key.json
  swamp model create @webframp/gcp/vertex-usage vertex-usage \
    --global-arg 'serviceAccountJson=${{ vault.get("gcp", "SA_KEY") }}' \
    --global-arg 'billingTable=my-billing.billing.gcp_billing_export_v1_XXXXXX'

  # Daily token/request usage for every discovered project
  swamp model method run vertex-usage scan_usage

  # Confirm which billing services to filter on, then pull cost
  swamp model method run vertex-usage discover_billing_services
  swamp model method run vertex-usage get_billing_costs
  ```

  ## Methods

  - **discover_projects** — List ACTIVE projects via Cloud Resource Manager
  - **scan_usage** — Daily rows per project/location/publisher/model/request type,
    with per-project status so failures are never mistaken for zero usage
  - **scan_gemini_api_usage** — Gemini API (generativelanguage) daily output
    tokens and request counts by method and API key
  - **discover_billing_services** — AI-related billing services and SKUs with cost
  - **get_billing_costs** — Gross cost, credits and net cost per day, project and SKU
  - **scan_projects**, **get_token_usage** — Legacy single-bucket scans
