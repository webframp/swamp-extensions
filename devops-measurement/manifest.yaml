manifestVersion: 1
name: "@webframp/devops-measurement"
version: "2026.09.01.1"
description: |
  Observe DevOps team effectiveness through cross-boundary collaboration.
  Watches the tools an organization already uses (GitLab, Redmine, Teams,
  CloudTrail), records each activity as an immutable event tagged with the
  crew that performed it and the crew that benefited, and surfaces the people
  whose help crosses crew boundaries most often and most effectively —
  the force multipliers.

  An observation engine, not a system of record: events are append-only,
  crews and members are reference data, and scoring is a pure function of the
  accumulated event history that can be re-run at any time.

  ## Contexts (models)

  - **crew-reference** — roster of members→crews and resources→crews
  - **collect-gitlab / collect-redmine / collect-teams / collect-cloudtrail** —
    one translation model per source; each `sync` emits uniform events
  - **events** — the deduplicated, append-only event log (`aggregate`)
  - **scoring** — cross-boundary ratio, reach, tier, force-multiplier (`score`)
  - **interaction-graph** — HELPED graph and centrality (`build`)

  Realizes the design in the measurement system's DDD design docs
  (Milestone 9: swamp integration).
